# Chatbot Académico UNAB - despliegue en AWS EC2 (Ubuntu) con Docker Compose
# Servicios: Caddy (HTTPS automático) · n8n · Servidor MCP/API (FastMCP) · App Gradio (PWA)
# La base de datos vive en Supabase (PostgreSQL + pgvector).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMINIO_BASE=${DOMINIO_BASE}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [n8n, app, mcp]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.47.7}
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.${DOMINIO_BASE}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n.${DOMINIO_BASE}/
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_RUNNERS_ENABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/rag_docs
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - API_TOKEN=${API_TOKEN}
      - CALENDARIO_CSV_URL=${CALENDARIO_CSV_URL}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./rag_docs:/data/rag_docs:ro
    expose: ["5678"]

  mcp:
    build: ./mcp_server
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_TOKEN=${API_TOKEN}
      - PORT=9000
    ports: ["9000:9000"]          # Security Group: puerto 9000 abierto para clientes MCP (HTTP streamable)
    volumes:
      - models:/models
      - ./rag_docs:/rag_docs:ro

  app:
    build: ./app
    restart: unless-stopped
    environment:
      - N8N_CHAT_URL=http://n8n:5678/webhook/chat-unab
      - API_URL=http://mcp:9000
      - API_TOKEN=${API_TOKEN}
    expose: ["7860"]
    depends_on: [mcp]

volumes:
  n8n_data:
  caddy_data:
  models:
