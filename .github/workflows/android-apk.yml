name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar APK (debug)
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AsistenteUNAB.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AsistenteUNAB-apk
          path: AsistenteUNAB.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.${{ github.run_number }}
          name: Asistente UNAB (APK ${{ github.run_number }})
          body: APK de la app Android (WebView sobre la app Gradio desplegada en AWS).
          files: AsistenteUNAB.apk
